<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noman Zulfiqar | MLSA</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0078D4, #00188F);
            color: white;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
        }
        h1 { margin: 0; font-size: 2.5em; }
        #greeting { font-size: 1.2em; font-weight: bold; color: #FFD700; margin-bottom: 5px; }
        #typewriter { font-size: 1.1em; opacity: 0.9; min-height: 1.2em; }
        .badge {
            background: #f2f2f2;
            color: #0078D4;
            padding: 5px 15px;
            border-radius: 50px;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }
        .footer { margin-top: 20px; font-size: 0.8em; opacity: 0.7; }
        .cursor { border-right: 2px solid white; animation: blink 0.7s infinite; }
        @keyframes blink { 50% { border-color: transparent; } }
    </style>
</head>
<body>
    <div class="container">
        <div id="greeting">Loading...</div>
        <div class="badge">Microsoft Learn Student Ambassador</div>
        <h1>Noman Zulfiqar</h1>
        <p id="typewriter"></p>
        <hr style="border: 0.5px solid rgba(255,255,255,0.2); margin: 20px 0;">
        <p>My first website successfully deployed via <b>GitHub Pages</b>!</p>

        <div style="margin-top: 20px;">
            <a href="https://www.linkedin.com/in/noman-zulfiqar-0916833a4" target="_blank" style="color: white; margin: 0 10px; text-decoration: none; border: 1px solid white; padding: 5px 15px; border-radius: 5px; font-size: 0.8em; display: inline-block;">LinkedIn</a>
            <a href="https://github.com/nomanzulfiqar121-ctrl" target="_blank" style="color: white; margin: 0 10px; text-decoration: none; border: 1px solid white; padding: 5px 15px; border-radius: 5px; font-size: 0.8em; display: inline-block;">GitHub</a>
        </div>

        <div class="footer">Built with ❤️ and AI Support</div>
    </div>

    <script>
        // 1. Dynamic Greeting Magic
        const hour = new Date().getHours();
        const greetingElement = document.getElementById('greeting');
        if (hour < 12) greetingElement.innerText = "Good Morning! ☀️";
        else if (hour < 18) greetingElement.innerText = "Good Afternoon! ☁️";
        else greetingElement.innerText = "Good Evening! 🌙";

        // 2. Typewriter Effect Magic
        const text = "Future Cloud Engineer & Developer";
        let index = 0;
        function typeEffect() {
            if (index < text.length) {
                document.getElementById("typewriter").innerHTML += text.charAt(index);
                index++;
                setTimeout(typeEffect, 100);
            }
        }
        window.onload = typeEffect;
    </script>
</body>
</html>
